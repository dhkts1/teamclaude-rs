# A second compose file, merged in with `-f` alongside the shared
# compose.yml, so this scenario can give node-a2 a non-default listen port
# without touching compose.yml itself.
#
# node-a2's PEER_LISTEN in compose.yml is a literal, not a `${VAR:-default}`,
# so there is no way to reach it from outside without editing that file. The
# templated form NODE_A2_FIND and NODE_A2_ANNOUNCE_NAME already use
# (`PEER_LISTEN: ${NODE_A2_PEER_LISTEN:-0.0.0.0:7755}`) would let this file
# go away.
services:
  node-a2:
    environment:
      PEER_LISTEN: 0.0.0.0:7766
