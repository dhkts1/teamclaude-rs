# Keeps the CI actions and Rust dependencies fresh so the cache stays warm on
# current toolchains and security advisories land as PRs, not surprises.
#
# commit-message.prefix is "chore" with NO `include: scope` — this repo's commit
# gate rejects parenthesized scopes (chore(deps): ...), so the plain `chore:`
# form is required.
version: 2
updates:
  # GitHub Actions: checkout, rust-cache, install-action, dtolnay/rust-toolchain.
  #
  # EXPECT A RECURRING PR HERE THAT MUST BE CLOSED, NOT MERGED, and close it
  # rather than re-diagnosing it every time.
  #
  # `.github/workflows/release.yml` is GENERATED by cargo-dist and dist verifies
  # on every run that the file still matches what it would emit. dist 0.32.0 pins
  # `actions/checkout@v6`, so when dependabot bumps that file the `plan` job dies:
  #
  #     × release.yml has out of date contents and needs to be regenerated
  #       -      - uses: actions/checkout@v7
  #       +      - uses: actions/checkout@v6
  #
  # exit 255, and a tag pushed in that state produces NO release. The trap is that
  # `ci`, `audit`, `miri` and `tsan` all stay green — only `plan` goes red, and it
  # is the one that matters. (Closed once already: PR #30.)
  #
  # Those pins are dist's to move; they change when dist is upgraded, not by
  # editing the generated file. `dist init` would just revert the bump.
  #
  # Not fixed with a scoped ignore because dependabot cannot exclude a single
  # file for the github-actions ecosystem — dependabot-core#2883, open since 2020.
  # `ignore: dependency-name: actions/checkout` is repo-wide and would also freeze
  # ci.yml, which IS hand-maintained and is correctly on @v7 already.
  #
  # Deliberately NOT setting `allow-dirty = ["ci"]` in dist-workspace.toml: that
  # would let the bump merge, but only by switching off the check that caught it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  # Rust crates. Batch the routine minor/patch bumps into one PR; majors (which
  # may carry breaking changes) come as separate, individually reviewable PRs.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
