# Build, sign, notarize and publish TcrBar.app for a tagged release.
#
# This runs alongside `release.yml` (the dist-generated workflow that publishes
# the `tcr` CLI tarballs) on the same tags. Two workflows rather than one
# because the CLI is cross-platform and cheap, while this job needs a macOS
# runner, an Apple certificate and a notarization round-trip.
#
# TAG-TRIGGERED ONLY, DELIBERATELY. This job holds a Developer ID private key,
# an App Store Connect API key and Sparkle's update-signing key. A
# `pull_request` trigger would hand all three to anyone who opens a PR from a
# fork, and Sparkle's key in particular signs the payload every existing
# install trusts. Do not add `pull_request` or `workflow_dispatch` with these
# secrets in scope.
name: Release app

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Releases are currently cut LOCALLY (see docs/RELEASING.md), so none of the
  # signing secrets are set on this repository. Without this job every `v*` tag
  # would start `release-app`, which would fail at the certificate import — a
  # red release run on every tag, forever, for a repository that has
  # deliberately not been given an Apple signing key.
  #
  # The check has to be a separate job because the `secrets` context is NOT
  # available in a job-level `if:`. Per GitHub's context-availability table,
  # `jobs.<job_id>.if` accepts only `github`, `needs`, `vars` and `inputs`;
  # `secrets` is readable in a step `env:`, which is what this job does. It
  # emits only the literal `true` or `false` — never the value, never a length.
  check-signing-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      have-secrets: ${{ steps.probe.outputs.have-secrets }}
    steps:
      - name: Probe for the signing secrets without revealing them
        id: probe
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # No `set -x` here, and nothing below prints a secret's value or its
          # length: `[ -n ... ]` is the only thing ever done with one. Secret
          # NAMES are not secret, so reporting which are missing is safe.
          set -euo pipefail
          missing=()
          for name in \
            MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD KEYCHAIN_PASSWORD \
            APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID \
            SPARKLE_ED_PRIVATE_KEY
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "have-secrets=true" >> "$GITHUB_OUTPUT"
            echo "All signing secrets are set; the signing job will run."
            exit 0
          fi

          echo "have-secrets=false" >> "$GITHUB_OUTPUT"

          # A PARTIAL set is a misconfiguration, not a deliberate opt-out, and
          # failing loudly beats silently shipping no app for a tag someone
          # believed was signed. Only a completely empty set skips cleanly.
          if [ "${#missing[@]}" -ne 7 ]; then
            {
              echo "## Release app: FAILED — signing secrets are incomplete"
              echo
              echo "Some signing secrets are set but these are missing:"
              echo
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
              echo
              echo "Set the missing secrets, or unset them all to skip signing in CI."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: incomplete signing secret set; missing: ${missing[*]}" >&2
            exit 1
          fi

          {
            # A quoted heredoc so the backticks stay literal markdown.
            cat <<'MD'
          ## Release app: SKIPPED — signing secrets are not set

          None of the seven macOS signing secrets exist on this repository, so
          there is nothing to sign with and the signing job was skipped rather
          than failed.

          This is the intended configuration: releases are cut LOCALLY with
          `apps/macos/scripts/release-tcrbar.sh`, and the Apple signing key is
          deliberately not stored in GitHub.

          See `docs/RELEASING.md`. To sign in CI instead, set all of:

          MD
            for name in "${missing[@]}"; do echo "- $name"; done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SKIPPING: no signing secrets are set on this repository."
          echo "Releases are cut locally with apps/macos/scripts/release-tcrbar.sh."
          echo "See docs/RELEASING.md."

  release-app:
    needs: check-signing-secrets
    if: needs.check-signing-secrets.outputs.have-secrets == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # CFBundleVersion is `git rev-list --count HEAD`. A shallow clone
          # reports 1, which macOS reads as a downgrade — build-tcrbar.sh
          # aborts on a shallow repository rather than ship one.
          fetch-depth: 0

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import the Developer ID certificate into an ephemeral keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # A keychain created and destroyed inside this job, never the default
          # login keychain: the runner is ephemeral in theory, and a signing key
          # left in a shared keychain is a key any later step can use.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -P "$MACOS_CERT_PASSWORD" \
            -f pkcs12 -t cert -k "$keychain" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign's request for the private key raises a UI
          # prompt that no one can answer, so the job HANGS until the timeout
          # instead of failing. It is the single most common CI signing defect.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          # Put it on the search list so `security find-identity` sees it.
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$p12"
          # Report the COUNT, never the identity: the identity string contains a
          # human name and the team id, and this repository is public.
          echo "codesigning identities available: $(security find-identity -v -p codesigning | grep -c 'Developer ID Application' || true)"

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc-key.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and publish
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          # The Sparkle PUBLIC key is not a secret — it goes into Info.plist so
          # the installed app can verify what it downloads. It lives in a repo
          # variable so it is reviewable.
          TCRBAR_SPARKLE_PUBLIC_KEY: ${{ vars.TCRBAR_SPARKLE_PUBLIC_KEY }}
          RELEASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TCRBAR_SPARKLE_PUBLIC_KEY:-}" ]; then
            echo "ERROR: repository variable TCRBAR_SPARKLE_PUBLIC_KEY is unset." >&2
            echo "ERROR: the app would ship unable to verify its own updates." >&2
            echo "ERROR: See docs/RELEASING.md (generate_keys prints the public key)." >&2
            exit 1
          fi
          apps/macos/scripts/release-tcrbar.sh --tag "$GITHUB_REF_NAME"

      - name: Upload the DMG as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TcrBar-dmg
          path: apps/macos/build/*.dmg
          if-no-files-found: ignore

      - name: Destroy the ephemeral keychain and the API key
        if: always()
        run: |
          # `if: always()` so a failed build cannot leave a signing key or an
          # App Store Connect key behind on the runner.
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/cert.p12" || true
