name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the repo — none comment on PRs,
# push tags, or publish. Deny everything except contents:read so a compromised
# action can't escalate. Raise per-job if a future job needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo/{registry,git} + target/. Auto-keys on Cargo.lock +
      # rustc version + job name, so this cache stays isolated from the tsan/
      # miri jobs' sanitizer builds. Typically 50-80% faster warm builds.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # --locked: fail if CI would silently rewrite Cargo.lock. Pins the exact
      # dependency set that was reviewed — important for an auth-handling proxy.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all --locked

      - name: Build (release)
        run: cargo build --release --locked

  # The only job on a macOS runner, and the only place any Swift is compiled.
  # Before this existed the app's Swift tests had never run in CI at all, so a
  # Rust-side change could silently break TcrBar with every check green.
  #
  # Deliberately does NOT re-run fmt/clippy: those are platform-independent and
  # already gated by `ci`. macOS runner minutes are billed at a multiple of
  # Linux, so this job runs only what Linux cannot answer.
  macos:
    name: macos
    runs-on: macos-latest
    # macOS runners are slower than ubuntu-latest and this job compiles both
    # toolchains; 20 (the `ci` budget) is too tight for a cold cache.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Auto-keys on runner OS as well as Cargo.lock, so this shares nothing
      # with the ubuntu jobs' caches.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Not a duplicate of the ubuntu `cargo test`: several modules take a
      # different code path here. src/singleton.rs shells out to `ps`/`lsof`
      # (BSD flags, different output columns), install placement relies on
      # rename(2) semantics, and $TMPDIR is a per-user sandbox path on macOS
      # rather than /tmp. macOS is also the only platform this app ships on.
      - name: Test (rust)
        run: cargo test --all --locked

      # Recorded so a runner-image bump that changes the Swift language mode is
      # attributable from the log rather than looking like a source regression.
      - name: Swift toolchain version
        run: swift --version

      # The Swift half of the `Format` job above. It lives here and not in `ci`
      # because swift-format ships inside the Xcode toolchain, which only the
      # macOS runner has — that is exactly the "only what Linux cannot answer"
      # rule in the comment above this job, not an exception to it.
      #
      # Resolved through xcrun rather than assumed on PATH: the toolchain binary
      # is not on a bare runner's PATH, and a bare `swift-format` would resolve
      # to whatever a future image happens to install instead.
      #
      # Scope is TcrBarCore + Tests, not all of Sources: Sources/TcrBar has a
      # large change in flight and is swept in a follow-up, at which point this
      # widens to `apps/macos/Sources`.
      - name: Format (swift)
        run: |
          swift_format="$(xcrun --find swift-format)"
          "$swift_format" --version
          "$swift_format" lint --strict -r apps/macos/Sources/TcrBarCore apps/macos/Tests

      # No SwiftPM cache: the package declares zero external dependencies, so
      # there is nothing to fetch, and .build artifacts key on the toolchain
      # and every source file — it would miss on essentially every run.
      - name: Build (swift)
        working-directory: apps/macos
        run: swift build

      # Reads tests/fixtures/status-contract.json by walking up from #filePath,
      # so it also proves the repo-relative fixture resolves on a clean checkout.
      - name: Test (swift)
        working-directory: apps/macos
        run: swift test

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # install-action caches the cargo-audit binary itself, so no target cache
      # is needed here — audit reads Cargo.lock, it doesn't compile the crate.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reports RustSec advisories. Exits non-zero only on real vulnerabilities;
      # unmaintained/unsound deps surface as warnings without failing the build.
      - name: Audit dependencies
        run: cargo audit

  tsan:
    name: tsan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: ThreadSanitizer (stress harness)
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          RUSTDOCFLAGS: "-Zsanitizer=thread"
        run: |
          cargo +nightly test -Z build-std --target x86_64-unknown-linux-gnu \
            concurrent_pacing_stress -- --test-threads=1 --nocapture

  # miri (UB detection), best-effort/informational. Scoped to pure leaf modules
  # (no network/fs) since miri can't execute real I/O. continue-on-error keeps a
  # miri gap from blocking merges — a signal, not a required gate.
  miri:
    name: miri
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # cache-on-failure: this job is continue-on-error, so still persist the
      # (expensive) miri build cache even when it surfaces UB, or every run
      # rebuilds std from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # cargo test takes ONE filter positional; run each pure module separately.
      # disable-isolation lets miri tolerate time/env access in the pure tests.
      - name: miri (pure tests)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri test model::
          cargo +nightly miri test account_uuid::
          cargo +nightly miri test quota::
