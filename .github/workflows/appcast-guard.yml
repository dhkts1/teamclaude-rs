# Guarantee that whatever release is CURRENTLY newest carries an appcast.xml.
#
# WHY THIS EXISTS. Sparkle's feed URL is baked into every shipped TcrBar.app:
#
#     SUFeedURL = .../releases/latest/download/appcast.xml
#
# `/releases/latest/` follows whichever release is newest — not the newest
# *TcrBar* release. So a release that carries no appcast asset silently becomes
# the feed, the URL 404s, and every installed copy shows "An error occurred in
# retrieving update information". The app cannot be fixed by shipping a new
# build, because the broken URL is already compiled into the installs that are
# failing. The only repair is to make the newest release carry the file.
#
# That is exactly what happened on 2026-08-27. v0.2.27 was first published as a
# CLI-only cargo-dist release (tarballs, installer, checksums — no TcrBar.app,
# no appcast), it became `/releases/latest/`, and the updater broke for everyone
# until an appcast was uploaded by hand. It was the fifth failure of this class
# in this project's history; `apps/macos/scripts/release-preflight.sh` check 4
# ("no assetless GitHub Release is serving the update feed") was written for
# precisely this and would have caught it — but that script runs before an APP
# release, and the release that orphaned the feed was a CLI one. The check was
# not missing. It was wired to the wrong trigger.
#
# So this enforces the invariant automatically, for EVERY release, rather than
# relying on an operator remembering to run a script before the one release type
# that happens not to build an app.
#
# NO SECRETS, DELIBERATELY. This needs only `contents: write` to attach a file
# that is already public in the repository. It is kept OUT of `release-app.yml`
# on purpose: that workflow holds the Developer ID key, the App Store Connect
# key and Sparkle's update-signing key, and its header states it is
# tag-triggered only so those keys are never exposed to a broader event. A
# `release: published` trigger there would break that rule for no benefit.
#
# IDEMPOTENT. A release that already carries an appcast is left untouched, so a
# real TcrBar release (which uploads its own, with the new version's entry and a
# matching enclosure length) is never overwritten by the repository's copy.
# Order does not matter: whichever of the two runs second is a no-op.
#
# KEPT, BUT REDUCED IN SCOPE — read before touching the `on:` block below.
#
# SUFeedURL no longer points at `/releases/latest/download/appcast.xml` as of
# the gh-pages feed (apps/macos/scripts/publish-appcast-feed.sh,
# docs/RELEASING.md § "The update feed"). For a build carrying that fix, the
# whole class this guard exists for is structurally impossible: the feed lives
# on refs/heads/gh-pages, which the CLI release workflow
# (.github/workflows/release.yml) never touches, so a CLI-only release cannot
# become the feed regardless of what `/releases/latest/` resolves to. This
# guard is kept anyway because every copy built BEFORE that fix still carries
# the old URL and stays exposed to exactly this failure until it updates —
# which it can only do by successfully reaching the feed at least once, so
# `/releases/latest/download/appcast.xml` must keep resolving for them in the
# meantime.
#
# THE `release: published` TRIGGER BELOW IS DEAD, not from any change in this
# commit. GitHub does not fire `release: published` for a release created by a
# workflow using the default `GITHUB_TOKEN` (the anti-recursion rule that also
# keeps a `GITHUB_TOKEN`-authored push from retriggering `push`-triggered
# workflows) — and `release.yml` (cargo-dist) is exactly that: `GH_TOKEN:
# ${{ secrets.GITHUB_TOKEN }}`. It has never once fired against the release
# type that orphaned the feed on 2026-08-27; only a release published by a
# human through the UI, or with a personal token, reaches it. It is kept here
# for that path, alongside the manual `workflow_dispatch` repair.
#
# The real automatic path is `workflow_run`, watching both `Release`
# (cargo-dist, .github/workflows/release.yml) and `Release app`
# (.github/workflows/release-app.yml) for `completed`. GitHub always fires
# `workflow_run.completed` regardless of which token drove the workflow it
# watches, because the anti-recursion rule keys on the EVENT a token's own
# actions would produce (a push, a release) — not on runs of a workflow
# another job named explicitly. The job below skips when the triggering run
# did not succeed, and resolves the tag from `git tag --points-at` the
# completed run's head SHA, since `workflow_run` carries no release-tag field.
name: Appcast feed guard

on:
  # DEAD ON ARRIVAL, kept as documentation. GitHub does not raise events for
  # actions taken with the default GITHUB_TOKEN, and `release.yml` (cargo-dist)
  # creates the Release with `secrets.GITHUB_TOKEN`. Measured 2026-09-17 over
  # this workflow's entire history: 100 runs, 100 of them `workflow_run`, ZERO
  # `release`. The trigger that names the exact fact this job guards has never
  # once fired and cannot, so the two below are what actually runs it.
  release:
    types: [published]
  # Prompt but EARLY: this fires when a workflow finishes, which is not the same
  # fact as "a Release now serves the feed". On 2026-09-17 it fired nine seconds
  # into the v1.1.7 tag build, minutes before cargo-dist had created anything.
  # The job now waits for the Release rather than asserting about its absence.
  workflow_run:
    workflows: ["Release", "Release app"]
    types: [completed]
  # The backstop, and the only trigger no token policy and no race can suppress.
  # It reads the live feed URL instead of reasoning about events, so a release
  # that orphaned the feed is repaired within the interval even if every other
  # trigger missed it. Off-the-hour on purpose.
  schedule:
    - cron: '17 */6 * * *'
  # Manual repair hatch: if a release is already orphaning the feed, run this
  # against it rather than uploading by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to repair (e.g. v0.2.27)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: appcast-guard-${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  ensure-appcast:
    runs-on: ubuntu-24.04
    # `workflow_run` fires on every conclusion (failure, cancelled, success); a
    # release that never finished building has no appcast to protect yet.
    #
    # It also fires for runs that are not releases at all. `Release` runs on
    # `pull_request` too — cargo-dist's `plan` job is one of main's required
    # checks — so every PR reached the resolve step, found no tag pointing at a
    # PR commit, and failed. Measured over this workflow's whole history: 16 of
    # 20 runs failed that way, and the 4 that passed were the 4 real releases.
    # A guard that is red four times in five cannot raise an alarm anyone reads,
    # and this one exists for a failure class that orphaned the Sparkle feed
    # five times.
    #
    # The discriminator is measured, not assumed. For a tag build `workflow_run`
    # reports `event=push` with `head_branch` set to the tag itself (`v1.1.5`);
    # for a PR build it reports `event=pull_request` with the branch name. So a
    # non-release run is filtered out HERE, before the job starts, rather than
    # being turned into a passing no-op inside it — the resolve step keeps
    # failing loudly when a run that really is a tag build has no tag, because
    # that is a genuine anomaly and the alarm has to stay believable.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve the tag to check
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -n "${RELEASE_TAG}" ]; then
            tag="${RELEASE_TAG}"
          elif [ -n "${DISPATCH_TAG}" ]; then
            tag="${DISPATCH_TAG}"
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            # The sweep has no tag to be handed one. It asks the same question
            # the failure class is about: which release is /releases/latest/
            # serving right now? An empty answer means the repository has no
            # published release at all, which is not a fault.
            tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
            if [ -z "${tag}" ]; then
              echo "no published release in this repository — nothing is serving the feed."
              echo "tag=" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "sweep: /releases/latest/ currently serves ${tag}"
          elif [ -n "${RUN_SHA}" ]; then
            tag="$(git tag --points-at "${RUN_SHA}" | head -1)"
            if [ -z "${tag}" ]; then
              echo "::error::no tag points at ${RUN_SHA} (from the completed workflow run)"
              exit 1
            fi
          else
            echo "::error::no tag resolved from the event or input"
            exit 1
          fi
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

      - name: Ensure the release carries appcast.xml
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -z "${TAG}" ]; then
            # The scheduled sweep resolves an empty tag when the repository has
            # no published release. That is a legitimate state, not a fault.
            if [ "${EVENT_NAME}" = "schedule" ]; then
              echo "no release to check."
              exit 0
            fi
            echo "::error::no tag resolved from the event or input"
            exit 1
          fi

          # ONE read, classified THREE ways. The previous version asked twice and
          # had two branches for three states, so a Release that did not exist
          # fell through both: `gh release view` writes "release not found" to
          # stderr and nothing to stdout, so `"" = "true"` was false, and the
          # assets test read GREP's exit status rather than gh's. Control then
          # reached the upload and announced that a Release which was not there
          # "has no appcast.xml and is serving the Sparkle feed". Measured on
          # the v1.1.7 tag, 2026-09-17.
          #
          # The absent case is also the EXPECTED one on a workflow_run trigger:
          # that fires when a workflow finishes, which can be minutes before
          # cargo-dist has created anything. So absence gets a bounded wait
          # rather than an immediate verdict, and a verdict of "still nothing"
          # is a clean exit, because nothing that does not exist can serve a
          # feed.
          deadline=$(( $(date +%s) + 600 ))
          rel=""
          while :; do
            if rel="$(gh release view "$TAG" --json isDraft,assets 2>/dev/null)"; then
              break
            fi
            if [ "${EVENT_NAME}" != "workflow_run" ] || [ "$(date +%s)" -ge "$deadline" ]; then
              echo "no Release exists for $TAG — nothing is serving the feed, nothing to protect."
              exit 0
            fi
            echo "waiting for the Release for $TAG to be created…"
            sleep 20
          done

          if [ "$(printf '%s' "$rel" | jq -r .isDraft)" = "true" ]; then
            echo "$TAG is a draft — /releases/latest/ does not point at it yet; nothing to do."
            exit 0
          fi

          if printf '%s' "$rel" | jq -e '.assets[] | select(.name == "appcast.xml")' >/dev/null; then
            echo "$TAG already carries appcast.xml — leaving it alone."
            echo "(A real TcrBar release uploads its own; this must never overwrite it.)"
            exit 0
          fi

          if [ ! -f apps/macos/appcast.xml ]; then
            echo "::error::apps/macos/appcast.xml is missing from the repository at $TAG"
            exit 1
          fi

          echo "$TAG has no appcast.xml and is serving the Sparkle feed — attaching the repository copy."
          gh release upload "$TAG" apps/macos/appcast.xml

          # Verify the surface a user's updater actually reads, rather than
          # trusting the upload's exit status. This is the whole point of the
          # job; an upload that succeeded but left the feed 404ing would be a
          # green run and a broken updater.
          code="$(curl -sIL -o /dev/null -w '%{http_code}' \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml")"
          if [ "$code" != "200" ]; then
            echo "::error::feed still not resolving after upload (HTTP $code)"
            exit 1
          fi
          echo "feed resolves (HTTP 200)"
